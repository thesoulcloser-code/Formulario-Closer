.toast.on{opacity:1}
@media(max-width:760px){.hero-in,.two{grid-template-columns:minmax(0,1fr)}.dialbox{order:-1;max-width:330px;margin:auto}.live{grid-template-columns:minmax(0,1fr)}.live .mini{display:none}}
@media(max-width:600px){.roles,.stats{grid-template-columns:minmax(0,1fr)}.split{font-size:14px}}
</style>

<script>

};

const STEPS=[["home","Inicio"],["mito","El mito"],["despertar","Despertar"],["estructura","Tu personalidad"],["registro","Registro"],["resultado","Resultado"]];

["Tengo que invertir dinero para empezar a vender.","No compras inventario, paquetes ni membresías para poder vender. Lo que inviertes es en tu formación, como en cualquier profesión."],

["¿Qué te ha detenido hasta hoy de explorar el mundo de las ventas?",[["Creo que necesito experiencia previa",null],["No sé por dónde empezar",null],["Miedo al rechazo",null],["Creo que no tengo el perfil",null]],

];
const exAns=k=>{const i=EX.findIndex(e=>e[3]==k);return i>=0&&S.ea[i]!=null?EX[i][1][S.ea[i]][0]:""};
const DIMS={
S1:["Iniciativa","s","Abres conversaciones sin esperar permiso. Es la materia prima del setter.","Te cuesta dar el primer paso con desconocidos. Con guiones y práctica se vuelve rutina."],
S2:["Ritmo y energía","s","Te energiza el volumen: muchas conversaciones no te desgastan.","El volumen te drena. Necesitas bloques de trabajo diseñados para tu energía."],

C2:["Temple ante objeciones","c","Sostienes silencios y objeciones sin perder tu centro.","La tensión te empuja a ceder o a llenar silencios. Es lo primero que se pule en roleplays."],
C3:["Dirección","c","Guías la conversación hacia una decisión, con respeto.","Prefieres no presionar y a veces dejas a la persona sin decidir. Dirigir no es empujar."]
};
// Cada opción: [texto, rasgo, puntos]. Las 7 primeras definen el rol (número impar: nunca hay empate).
const PQ=[
["r","Las personas que te conocen dirían que eres…",[["Sociable: hablo con todo el mundo","S1",3],["Profunda/o: me gusta conocer de verdad a las personas","C1",3],["Amigable y fácil de tratar","S1",2],["Buena/o para escuchar","C1",2]]],
["r","Tu energía natural es…",[["Serena: pocas cosas me alteran","C2",2],["Rápida: me encanta el movimiento y hacer muchas cosas","S2",3],["Constante y calmada, aun bajo presión","C2",3],["Activa, con pausas cortas para recargar","S2",2]]],
["r","¿Cómo tomas tus decisiones?",[["Con orden: listas, pasos y un plan claro","S3",3],["Confío en lo que percibo de la situación","C3",2],["Primero organizo toda la información","S3",2],["Con convicción: decido y me hago cargo","C3",3]]],
["r","En un equipo, tu rol natural es…",[["Quien lidera y ayuda a decidir","C3",3],["La persona organizada que no deja nada pendiente","S3",3],["Quien convence a los demás de una idea","C3",2],["Quien da seguimiento a cada detalle","S3",2]]],
["r","¿Qué te motiva más?",[["Muchas pequeñas victorias cada día","S2",3],["Ayudar a alguien a vencer sus miedos para decidir","C2",2],["Conectar con mucha gente distinta","S1",2],["Una gran victoria que cambia la vida de alguien","C3",3]]]
];
const ARCH={
c:["Closer de alma","Lees lo que la persona no dice, sostienes la tensión y guías hacia una decisión. Tu lugar natural es la llamada de cierre: diagnosticar, escuchar a fondo y acompañar a alguien a decir sí (o un no honesto)."],
s:["Setter estratega","Abres puertas con energía, sostienes el volumen y das seguimiento con sistema. Tu lugar natural es iniciar conversaciones, calificar a los prospectos y llenar la agenda del closer con citas que sí valen la pena."]
};

const fresh=()=>({step:"home",flip:[],ei:0,ea:[],pi:0,pa:[]});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.step)S=fresh();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const app=document.getElementById("app");
const L="ABCD";

function dial(share,swing){
  const a=(share-.5)*180;
  return `<svg class="dial" viewBox="0 0 260 168" role="img" aria-label="Medidor entre Setter y Closer">
  <path d="M30 130 A100 100 0 0 1 130 30" fill="none" stroke="var(--st)" stroke-width="20" stroke-linecap="round"/>
  <path d="M130 30 A100 100 0 0 1 230 130" fill="none" stroke="var(--cl)" stroke-width="20" stroke-linecap="round"/>
  ${[...Array(11)].map((_,i)=>{const t=Math.PI*(1-i/10),x1=130+76*Math.cos(t),y1=130-76*Math.sin(t),x2=130+68*Math.cos(t),y2=130-68*Math.sin(t);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-opacity=".45" stroke-width="2"/>`}).join("")}
  <g class="needle ${swing?"swing":""}" style="transform:rotate(${a}deg)"><path d="M126 130 L130 44 L134 130Z" fill="currentColor"/></g>
  <circle cx="130" cy="130" r="11" fill="currentColor"/><circle cx="130" cy="130" r="4" fill="var(--cl)"/>
  <text x="30" y="162" text-anchor="middle" fill="currentColor" font-size="14" font-weight="700" font-family="DM Sans">Setter</text>
  <text x="230" y="162" text-anchor="middle" fill="currentColor" font-size="14" font-weight="700" font-family="DM Sans">Closer</text></svg>`;
}
function scores(){
  const t={},m={};Object.keys(DIMS).forEach(k=>{t[k]=0;m[k]=0});
  let sP=0,cP=0,sC=0,cC=0;
  PQ.forEach((q,i)=>{
    const mx={};q[2].forEach(o=>mx[o[1]]=Math.max(mx[o[1]]||0,o[2]));Object.keys(mx).forEach(k=>m[k]+=mx[k]);
    const v=S.pa[i];if(v==null)return;const o=q[2][v];t[o[1]]+=o[2];
    if(q[0]=="r"){if(DIMS[o[1]][1]=="c"){cP+=o[2];cC++}else{sP+=o[2];sC++}}
  });
  const d={};Object.keys(DIMS).forEach(k=>d[k]=m[k]?Math.round(t[k]/m[k]*100):0);
  const avg=r=>{const v=Object.keys(DIMS).filter(k=>DIMS[k][1]==r).map(k=>d[k]);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
  const win=cP>sP?"c":sP>cP?"s":cC>=sC?"c":"s";
  let share=sP+cP?cP/(sP+cP):.5;
  share=win=="c"?Math.min(.92,Math.max(.55,share)):Math.max(.08,Math.min(.45,share));
  return{d,s:avg("s"),c:avg("c"),b:avg("b"),share,win};
}
function steps(){
  const idx=STEPS.findIndex(x=>x[0]==S.step);
  document.getElementById("steps").innerHTML=STEPS.map((x,i)=>`<span class="${i==idx?"on":i<idx?"done":""}">${x[1]}</span>`).join("")+(S.step!="home"?`<button class="reset" data-act="restart">Reiniciar</button>`:"");
}
const V={};
V.home=()=>{
  const prog=S.ea.length||S.pa.length;
  return `<section class="hero band"><div class="hero-in"><div>
  <p class="kick">Test interactivo · unos 3 minutos</p>
  <h1>¿Naciste para ser Closer o Setter?</h1>
  <p class="lead">Descubre qué es realmente vender como closer o setter, responde las preguntas que casi nadie se hace y descubre, con un estudio de tu estructura de personalidad, qué rol encaja contigo.</p>
  <div class="row"><button class="btn big" data-act="go" data-v="mito">Comenzar mi evaluación</button>${prog?`<button class="btn ghost" data-act="resume">Continuar donde quedé</button>`:""}</div>
  </div><div class="dialbox">${dial(.5,true)}</div></div></section>
  <section class="band"><div class="wrap"><h2>Cuatro paradas, un resultado</h2>

  <div class="mod"><b>El mito</b><span>Qué es de verdad vender como closer o setter, y los mitos que te han frenado.</span></div>
  <div class="mod"><b>Despertar</b><span>Tres preguntas de neuroventa sobre tu vida y lo que de verdad quieres.</span></div>
  <div class="mod"><b>Tu personalidad</b><span>Cinco preguntas sobre tu personalidad que revelan si naciste para ser Closer o Setter.</span></div>
  <div class="mod"><b>Tu resultado</b><span>Si eres Closer o Setter, tu afinidad con cada rol, tus fortalezas y tu siguiente paso.</span></div>

};
V.mito=()=>{
  return `<section class="band"><div class="wrap">
  <h2>Primero, lo que esto no es</h2>
  <p><b>Vender como closer o setter no es un sistema piramidal.</b> En una pirámide ganas por reclutar personas que pagan para entrar. Aquí una empresa con un producto o servicio real te paga una comisión por las ventas que ayudas a lograr: no reclutas a nadie y no compras nada para empezar. Es un oficio con dos roles distintos:</p>
  <div class="roles"><div class="role s"><b>Setter</b>Abre conversaciones, califica a los prospectos y agenda la llamada. Es quien enciende la chispa.</div>
  <div class="role c"><b>Closer</b>Conduce la llamada de decisión: diagnostica, escucha, resuelve objeciones y cierra. Es quien acompaña al sí.</div></div>
  <h3>Toca cada mito para ver la realidad</h3>
  <div class="flips">${MYTHS.map((m,i)=>`<button class="flip ${S.flip.includes(i)?"on":""}" data-act="flip" data-v="${i}" aria-pressed="${S.flip.includes(i)}"><div class="inner"><div class="face front"><small>Mito</small><p>${m[0]}</p><em>Toca para voltear</em></div><div class="face back"><small>Realidad</small>${m[1]}</div></div></button>`).join("")}</div>
  <p class="count">${S.flip.length} de ${MYTHS.length} mitos derribados</p>
  <div class="row"><button class="btn big" data-act="go" data-v="despertar">Siguiente: preguntas que despiertan</button></div>
  </div></section>`;
};
V.despertar=()=>{
  const i=S.ei,q=EX[i],a=S.ea[i];
  return `<section class="band"><div class="qwrap">
  <span class="qn">Despertar · pregunta ${i+1} de ${EX.length}</span>
  <div class="bar"><i style="width:${i/EX.length*100}%"></i></div>
  <p class="q">${q[0]}</p>
  <div class="opts">${q[1].map((o,j)=>`<button class="opt ${a===j?"sel":""}" data-act="ex" data-v="${j}"><i>${L[j]}</i>${o[0]}</button>`).join("")}</div>
  <div class="row"><button class="back-link" data-act="exback">← Atrás</button></div>
  </div></section>`;
};
V.estructura=()=>{
  const i=S.pi,q=PQ[i],a=S.pa[i],sc=scores();
  return `<section class="band"><div class="qwrap"><div class="live"><div>
  <span class="qn">Tu personalidad · pregunta ${i+1} de ${PQ.length}</span>
  <div class="bar"><i style="width:${i/PQ.length*100}%"></i></div>
  <p class="q">${q[1]}</p>
  <div class="opts">${q[2].map((o,j)=>`<button class="opt ${a===j?"sel":""}" data-act="pq" data-v="${j}"><i>${L[j]}</i>${o[0]}</button>`).join("")}</div>
  <div class="row"><button class="back-link" data-act="pqback">← Atrás</button></div>
  <p class="fine">Responde cómo eres de verdad, no cómo te gustaría ser. No hay respuestas buenas ni malas.</p>
  </div><div class="mini">${dial(sc.share)}Tu aguja se mueve con cada respuesta</div></div></div></section>`;
};
function radar(d){
  const keys=["S1","S2","S3","C1","C2","C3"],cx=180,cy=150,R=96;
  const pt=(k,v)=>{const t=-Math.PI/2+k*2*Math.PI/keys.length;return[cx+R*v*Math.cos(t),cy+R*v*Math.sin(t)]};
  const rings=[.25,.5,.75,1].map(r=>`<polygon points="${keys.map((_,k)=>pt(k,r).join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-opacity=".15"/>`).join("");
  const poly=keys.map((k,i)=>pt(i,(d[k]||0)/100).join(",")).join(" ");
  const labels=keys.map((k,i)=>{const[x,y]=pt(i,1.22);const anc=Math.abs(x-cx)<8?"middle":x>cx?"start":"end";const col=DIMS[k][1]=="s"?"var(--st)":DIMS[k][1]=="c"?"var(--cl)":"currentColor";return `<text x="${x}" y="${y+4}" text-anchor="${anc}" font-size="12" font-weight="700" fill="${col}" font-family="DM Sans">${DIMS[k][0].split(" ")[0]}</text>`}).join("");
  return `<svg class="radar" viewBox="0 0 360 300" role="img" aria-label="Mapa de tus seis rasgos">${rings}<polygon points="${poly}" fill="var(--cl)" fill-opacity=".28" stroke="var(--cl)" stroke-width="2.5"/>${labels}</svg>`;
}
function result(){
  const sc=scores(),type=sc.win,A=ARCH[type];
  const cPct=Math.round(sc.share*100),sPct=100-cPct;
  const pot=Math.round(type=="c"?sc.c:sc.s);
  const sq=EX.map((e,i)=>e[1][0][1]!=null?i:-1).filter(i=>i>=0);
  const ex=sq.reduce((n,i)=>n+(S.ea[i]!=null?EX[i][1][S.ea[i]][1]:2),0);
  const awake=Math.round((ex-sq.length)/(3*sq.length)*100);
  const pool=Object.keys(DIMS).filter(k=>DIMS[k][1]==type);
  const sorted=pool.sort((x,y)=>sc.d[y]-sc.d[x]);
  return{sc,type,A,cPct,sPct,pot,awake,top:sorted.slice(0,2),low:sorted.slice(-1)};
}
function payload(){
  const R=result();
  return{perfil:R.type=="c"?"Closer":"Setter",afinidadCloser:R.cPct,afinidadSetter:R.sPct,potencial:R.pot,despertar:R.awake,
    fortalezas:R.top.map(k=>DIMS[k][0]).join(", "),porPulir:R.low.map(k=>DIMS[k][0]).join(", "),
    paraQue:exAns("para"),freno:exAns("freno")};
}
function sendLead(data){
  let ifr=document.getElementById("sink");
  if(!ifr){ifr=document.createElement("iframe");ifr.name="sink";ifr.id="sink";ifr.style.display="none";document.body.appendChild(ifr)}
  const f=document.createElement("form");f.method="POST";f.action=CONFIG.registro;f.target="sink";
  Object.entries(data).forEach(([k,v])=>{const i=document.createElement("input");i.type="hidden";i.name=k;i.value=String(v);f.appendChild(i)});
  document.body.appendChild(f);try{f.submit()}catch(e){}f.remove();
}
V.registro=()=>`<section class="band"><div class="gate">
  <span class="qn">Tu resultado está listo</span>
  ${dial(.5)}
  <p class="q">Antes de verlo, guarda tu resultado</p>
  <p style="margin-inline:auto">Tu perfil y tus puntajes ya están calculados. Déjanos tus datos para guardarlos y para que una mentora de THE SOUL CLOSER pueda acompañarte en tu siguiente paso.</p>
  <form id="regform" class="regform" novalidate>
    <label>Nombre completo<input name="nombre" autocomplete="name" required></label>
    <label>WhatsApp (con código de país)<input name="whatsapp" type="tel" autocomplete="tel" placeholder="+506 8888 7777" required></label>
    <label>Correo electrónico<input name="correo" type="email" autocomplete="email" required></label>
    <label>País<input name="pais" autocomplete="country-name" required></label>
    <details class="consent"><summary>Consentimiento informado (toca para leer)</summary>
      <p>Al enviar este formulario autorizo de forma libre, expresa e informada a THE SOUL CLOSER a guardar mis datos (nombre, WhatsApp, correo y país) y los resultados de mi test ¿Closer o Setter?, y a usarlos únicamente para contactarme por WhatsApp o correo con información sobre mi resultado, la mentoría THE SOUL CLOSER y oportunidades de formación en ventas.</p>
      <p>Entiendo que mis datos no se venden ni se ceden a terceros; que el test es una autoevaluación orientativa y no un diagnóstico psicológico clínico; y que puedo pedir en cualquier momento que dejen de contactarme, o consultar, corregir o eliminar mis datos, escribiendo al WhatsApp +506 6460 9165.</p>
      <p>Este consentimiento se otorga conforme a la Ley N.° 8968 de Protección de la Persona frente al Tratamiento de sus Datos Personales de Costa Rica.</p>
    </details>
    <label class="check"><input type="checkbox" name="consentimiento" required><span>He leído y acepto el consentimiento informado, y autorizo que me contacten por WhatsApp y correo.</span></label>
    <p class="err" id="regerr" role="alert"></p>
    <button class="btn big" type="submit">Guardar y ver mi resultado</button>
  </form>
  </div></section>`;
V.resultado=()=>{
  const R=result(),sc=R.sc;
  const para=(exAns("para")||"tu propósito").toLowerCase();
  const fi=EX.findIndex(e=>e[3]=="freno"),freno=exAns("freno");
  const awakeTxt=R.awake>=70?"Estás lista/o para moverte. La incomodidad que sientes es el motor.":R.awake>=40?"Algo en ti ya está pidiendo un cambio. Escúchalo antes de que se vuelva costumbre.":"Hoy estás en calma. Este test es una semilla: guárdala para cuando quieras dar el paso.";
  const waText=`Hola, hice el test ¿Closer o Setter? y mi perfil es «${R.A[0]}» (Setter ${R.sPct}% · Closer ${R.cPct}%). Quiero información de THE SOUL CLOSER.`;
  const wa=CONFIG.whatsapp?`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(waText)}`:"";
  const main=CONFIG.mentoria||wa;
  const bars=k=>{const v=sc.d[k],c=DIMS[k][1]=="s"?"var(--st)":DIMS[k][1]=="c"?"var(--cl)":"var(--ink)";return `<div class="d"><div><span>${DIMS[k][0]}</span><b>${v}</b></div><div class="t"><i style="width:${v}%;background:${c}"></i></div></div>`};
  return `<section class="band res-hero"><div class="wrap">
  <p class="kick">${S.nombre?S.nombre+", este es tu":"Tu"} perfil vendedor</p>
  ${dial(sc.share)}
  <h1>${R.A[0]}</h1>
  <p style="margin:0 auto 10px;color:#f1d6e0">${R.A[1]}</p>
  <p style="margin:14px auto 0;color:#f3b9cf;font-weight:700">Tu afinidad</p><div class="split" style="margin-top:6px"><div class="s" style="width:${Math.max(R.sPct,18)}%">Setter ${R.sPct}%</div><div class="c" style="width:${Math.max(R.cPct,18)}%">Closer ${R.cPct}%</div></div>
  </div></section>
  <section class="band"><div class="wrap">
  <div class="stats">
  <div class="stat"><b>${R.pot}</b><span>Potencial vendedor, de 100</span></div>
  <div class="stat"><b>${R.awake}</b><span>Índice de despertar, de 100</span></div>
  <div class="stat"><b>${R.type=="c"?R.cPct:R.sPct}%</b><span>Afinidad con tu rol</span></div>
  </div>
  <div class="two"><div>${radar(sc.d)}</div><div class="dims">
  ${["S1","S2","S3"].map(bars).join("")}${["C1","C2","C3"].map(bars).join("")}
  </div></div>
  <div class="two" style="margin-top:10px"><div><h3>Tus fortalezas</h3><ul class="list">${R.top.map(k=>`<li><b>${DIMS[k][0]}</b>${DIMS[k][2]}</li>`).join("")}</ul></div>
  <div><h3>Lo que vas a pulir</h3><ul class="list">${R.low.map(k=>`<li><b>${DIMS[k][0]}</b>${DIMS[k][3]}</li>`).join("")}</ul></div></div>
  <h3>Tu momento</h3>
  <p>${awakeTxt}</p>
  <p class="quote">Tu para qué: dedicar más tiempo ${para.startsWith("a ")?para:"a "+para}.</p>
  ${freno?`<p><b>Lo que te frenaba:</b> ${freno.toLowerCase()}. ${EX[fi][2][S.ea[fi]]}</p>`:""}
  <h3>La verdad que nadie te dice</h3>
  <p>El talento abre la puerta, pero no te sostiene adentro. La mayoría de quienes intentan vender solos se rinden en los primeros meses, no por falta de capacidad, sino porque nadie les corrige la llamada, nadie les da un guion probado y nadie les recuerda por qué empezaron. Un perfil como el tuyo necesita tres cosas: método, práctica guiada y alguien que te acompañe mientras pasas de la teoría a tu primera comisión.</p>
  <div class="cta" id="cta"><div class="ring"></div>
  <p class="kick">Tu siguiente paso</p>
  <h2>THE SOUL CLOSER</h2>
  <p>La mentoría para formar closers y setters desde adentro hacia afuera: vender con método y con alma, sin manipular.</p>
  <ul><li>El método paso a paso para el rol que mejor encaja contigo: ${R.type=="s"?"setter":"closer"}.</li>
  <li>Roleplays evaluados con rúbrica y retroalimentación personalizada.</li>
  <li>Acompañamiento cercano para trabajar justo lo que este test marcó como «por pulir».</li></ul>
  <div class="row"><a class="btn light big" href="${main||"#cta"}" target="_blank" rel="noopener">Quiero entrar a THE SOUL CLOSER</a>
  ${wa&&CONFIG.mentoria?`<a class="btn ghost" href="${wa}" target="_blank" rel="noopener">Hablar por WhatsApp</a>`:""}</div>
  ${main?"":`<p class="pend" style="margin-top:12px">Enlace de compra pendiente de configurar.</p>`}
  </div>
  <div class="row"><button class="btn ghost" data-act="copy">Copiar mi resultado</button><button class="back-link" data-act="restart">Hacer el test de nuevo</button></div>
  <p class="fine">Esta es una autoevaluación orientativa basada en tus preferencias de conducta. No es un diagnóstico psicológico clínico ni garantiza ingresos; su propósito es ayudarte a conocerte y decidir tu siguiente paso.</p>
  </div></section>`;
};
function render(top){
  if((S.step=="resultado"||S.step=="registro")&&S.pa.filter(x=>x!=null).length<PQ.length)S.step="estructura";
  app.innerHTML=V[S.step]();steps();save();
  if(top)window.scrollTo({top:0,behavior:"instant"});
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
let lock=false;
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,v=b.dataset.v;
  if(act=="go"){S.step=v;render(true)}
  else if(act=="resume"){S.step=S.reg?"resultado":S.pa.filter(x=>x!=null).length==PQ.length?"registro":S.pa.length?"estructura":S.ea.length?"despertar":"mito";render(true)}
  else if(act=="flip"){const i=+v;S.flip.includes(i)?S.flip=S.flip.filter(x=>x!=i):S.flip.push(i);b.classList.toggle("on");b.setAttribute("aria-pressed",S.flip.includes(i));const c=app.querySelector(".count");if(c)c.textContent=`${S.flip.length} de ${MYTHS.length} mitos derribados`;save()}
  else if(act=="ex"){if(lock)return;lock=true;S.ea[S.ei]=+v;
    app.querySelectorAll(".opt").forEach((o,j)=>o.classList.toggle("sel",j==+v));
    setTimeout(()=>{lock=false;if(S.ei<EX.length-1){S.ei++}else{S.step="estructura"}render(true)},350)}
  else if(act=="exback"){if(S.ei>0){S.ei--;render(true)}else{S.step="mito";render(true)}}
  else if(act=="pq"){if(lock)return;lock=true;S.pa[S.pi]=+v;
    app.querySelectorAll(".opt").forEach((o,j)=>o.classList.toggle("sel",j==+v));
    const n=app.querySelector(".needle");if(n)n.style.transform=`rotate(${(scores().share-.5)*180}deg)`;
    setTimeout(()=>{lock=false;if(S.pi<PQ.length-1){S.pi++;render(true)}else{S.step="registro";render(true)}},380)}
  else if(act=="pqback"){if(S.pi>0){S.pi--;render(true)}else{S.step="despertar";S.ei=EX.length-1;render(true)}}
  else if(act=="restart"){S=fresh();render(true)}
  else if(act=="copy"){const R=result();const t=`Mi resultado en el test ¿Closer o Setter? de THE SOUL CLOSER\nPerfil: ${R.A[0]}\nSetter ${R.sPct}% · Closer ${R.cPct}%\nPotencial vendedor: ${R.pot}/100\nFortalezas: ${R.top.map(k=>DIMS[k][0]).join(", ")}\nPor pulir: ${R.low.map(k=>DIMS[k][0]).join(", ")}`;
    try{navigator.clipboard.writeText(t).then(()=>toast("Resultado copiado"),()=>toast("No se pudo copiar"))}catch(err){toast("No se pudo copiar")}}
});
document.addEventListener("submit",e=>{
  if(e.target.id!="regform")return;e.preventDefault();
  const f=e.target,g=n=>f.elements[n].value.trim(),err=document.getElementById("regerr");
  const tel=g("whatsapp").replace(/[^\d+]/g,"");
  if(!g("nombre")||!g("pais")){err.textContent="Completa tu nombre y tu país.";return}
  if(tel.replace("+","").length<8){err.textContent="Escribe tu WhatsApp con el código de país.";return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g("correo"))){err.textContent="Revisa tu correo electrónico.";return}
  if(!f.elements.consentimiento.checked){err.textContent="Para continuar, acepta el consentimiento informado.";return}
  sendLead(Object.assign({nombre:g("nombre"),whatsapp:g("whatsapp"),correo:g("correo"),pais:g("pais"),consentimiento:"true"},payload()));
  f.querySelector("button").disabled=true;f.querySelector("button").textContent="Guardando…";
  S.reg=true;S.nombre=g("nombre").split(" ")[0].replace(/[&<>"']/g,"");
  setTimeout(()=>{S.step="resultado";render(true)},900);
});
render();
}
</script>
